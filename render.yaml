# Render Blueprint — https://render.com/docs/blueprint-spec
# Banco: Postgres externo no Neon (o workspace já usa o Postgres grátis do Render).
services:
  - type: web
    name: task-manager
    runtime: docker
    plan: free
    # Puma direto (sem Thruster), escutando na $PORT que o Render define.
    # O entrypoint roda `db:prepare` (cria schema + seeds) antes de subir.
    dockerCommand: ./bin/rails server
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        sync: false # connection string do Neon, preenchida no painel
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
